name: task-progress
version: "0.1.0"
kind: standalone
description: "One editable chat entry per long task: opens once when a background process is spawned, then edits that same message as the liveness ledger reports real state/phase/progress changes. Terminal states are write-once; interim tool output never opens a message."
author: agentcore
provides_tools: []
provides_hooks:
  - post_tool_call
