[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "通用智能体本体：记忆引擎（SQLite 双路召回 + 向量索引）+ 身份纪律骨架 / 工具面 / 运行时骨架 / 平台适配补丁；业务约定由宿主注入，业务内容一律不进本仓"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "agentcore" }]
keywords = ["memory", "sqlite", "vector-search", "agent", "embedding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/caixuf/super-agent"
Repository = "https://github.com/caixuf/super-agent"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agentcore*"]

# sqlite-vec 扩展必须随包分发：召回时按包相对路径查找，不依赖 CWD。
[tool.setuptools.package-data]
"agentcore.memory" = ["vendor/*.so", "vendor/vec0", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"